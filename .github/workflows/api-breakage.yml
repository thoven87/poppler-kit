name: API breaking changes

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-apibreakage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Increased: poppler 26.05.0 is compiled from source
    timeout-minutes: 40
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so the tool can diff against the base branch
          fetch-depth: 0

      # actions/checkout inside a container doesn't inherit the host's safe-directory
      # config, causing git to refuse operations on the workspace.
      # https://github.com/actions/checkout/issues/766
      - name: Mark workspace as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            cmake g++ pkg-config wget xz-utils \
            libjpeg-dev libopenjp2-7-dev libfontconfig1-dev \
            libglib2.0-dev

      # ENABLE_UTILS=OFF: CLI tools are not needed for the API diff check,
      # so we skip them to reduce build time.
      - name: Build and install poppler 26.05.0
        run: |
          cd /tmp
          wget -q https://poppler.freedesktop.org/poppler-26.05.0.tar.xz
          tar -xf poppler-26.05.0.tar.xz
          cd poppler-26.05.0
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_UTILS=OFF
          make -j"$(nproc)"
          make install
          ldconfig
          pkg-config --modversion poppler-cpp

      - name: Check for API breaking changes
        run: |
          swift package diagnose-api-breaking-changes origin/${GITHUB_BASE_REF}
