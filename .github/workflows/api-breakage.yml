name: API breaking changes

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-apibreakage
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Increased: poppler is compiled from source
    timeout-minutes: 40
    container:
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so the tool can diff against the base branch
          fetch-depth: 0

      # actions/checkout inside a container doesn't inherit the host's safe-directory
      # config, causing git to refuse operations on the workspace.
      # https://github.com/actions/checkout/issues/766
      - name: Mark workspace as safe
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install poppler build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            wget \
            pkg-config \
            libfreetype-dev \
            libfontconfig-dev \
            libjpeg-dev \
            libpng-dev \
            libtiff-dev \
            libopenjp2-7-dev \
            zlib1g-dev \
            liblcms2-dev \
            libnss3-dev \
            libcairo2-dev \
            xz-utils

      - name: Build and install poppler 26.05.0
        run: |
          cd /tmp
          wget -q https://poppler.freedesktop.org/poppler-26.05.0.tar.xz
          tar -xJf poppler-26.05.0.tar.xz

          cmake -S poppler-26.05.0 -B poppler-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_BOOST=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_GLIB=OFF \
            -DENABLE_GOBJECT_INTROSPECTION=OFF \
            -DENABLE_LIBCURL=OFF \
            -DENABLE_CPP=ON \
            -DENABLE_UTILS=OFF \
            -DENABLE_LIBOPENJPEG=openjpeg2 \
            -DBUILD_GTK_TESTS=OFF \
            -DBUILD_QT5_TESTS=OFF \
            -DBUILD_QT6_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF \
            -DBUILD_MANUAL_TESTS=OFF

          cmake --build poppler-build --parallel "$(nproc)"
          cmake --install poppler-build
          ldconfig

          pkg-config --modversion poppler-cpp

      - name: Check for API breaking changes
        run: |
          swift package diagnose-api-breaking-changes origin/${GITHUB_BASE_REF}
