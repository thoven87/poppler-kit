name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**.swift"
      - "**.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Increased: poppler 26.05.0 is compiled from source (~5–10 min)
    timeout-minutes: 40
    container:
      # Ubuntu 24.04 — minimum required to build poppler 26
      # (poppler 26.05.0 release notes: "minimum deps = Ubuntu 24.04")
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build-time dependencies for poppler 26.05.0.
      # Note: libopenjp2-7-dev is OpenJPEG 2.x (correct); libopenjpeg-dev is 1.x (legacy).
      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config wget xz-utils \
            libjpeg-dev libopenjp2-7-dev libfontconfig1-dev \
            libglib2.0-dev libnss3-dev

      # Build and install poppler 26.05.0 from source.
      # cmake auto-detects available features; we only override the install
      # prefix (so pkg-config finds poppler-cpp.pc in /usr/lib/pkgconfig)
      # and disable Qt bindings (not needed and avoids pulling Qt deps).
      - name: Build and install poppler 26.05.0
        run: |
          cd /tmp
          wget -q https://poppler.freedesktop.org/poppler-26.05.0.tar.xz
          tar -xf poppler-26.05.0.tar.xz
          cd poppler-26.05.0
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_GPGME=OFF
          make -j"$(nproc)"
          make install
          ldconfig
          pkg-config --modversion poppler-cpp

      - name: Build
        run: swift build

      - name: Test
        run: swift test
