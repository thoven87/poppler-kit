name: CI

on:
  push:
    branches:
      - main
    paths:
      - "**.swift"
      - "**.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    # Increased: poppler 26.05.0 is compiled from source (~5–10 min)
    timeout-minutes: 40
    container:
      # Ubuntu 24.04 — minimum required to build poppler 26
      # (poppler 26.05.0 release notes: "minimum deps = Ubuntu 24.04")
      image: swift:6.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build-time dependencies for poppler 26.05.0.
      # Note: libopenjp2-7-dev is OpenJPEG 2.x (correct); libopenjpeg-dev is 1.x (legacy).
      - name: Install build dependencies
        run: |
          apt-get update -q
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config wget xz-utils \
            libfreetype-dev libfontconfig-dev libjpeg-dev libpng-dev libtiff-dev \
            libopenjp2-7-dev zlib1g-dev liblcms2-dev libnss3-dev libcairo2-dev

      # Build and install poppler 26.05.0 from source.
      # Flags mirror the Dockerfile.example exactly so CI and container builds
      # use identical cmake configuration.
      - name: Build and install poppler 26.05.0
        run: |
          cd /tmp
          wget -q https://poppler.freedesktop.org/poppler-26.05.0.tar.xz
          tar -xJf poppler-26.05.0.tar.xz
          cmake -S poppler-26.05.0 -B poppler-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_BOOST=OFF \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=OFF \
            -DENABLE_GLIB=OFF \
            -DENABLE_GPGME=OFF \
            -DENABLE_LIBCURL=OFF \
            -DENABLE_CPP=ON \
            -DENABLE_UTILS=ON \
            -DENABLE_LIBOPENJPEG=openjpeg2 \
            -DBUILD_GTK_TESTS=OFF \
            -DBUILD_CPP_TESTS=OFF \
            -DBUILD_MANUAL_TESTS=OFF
          cmake --build poppler-build --parallel "$(nproc)"
          cmake --install poppler-build
          ldconfig
          pkg-config --modversion poppler-cpp

      - name: Build
        run: swift build --build-tests --configuration debug -Xswiftc -enable-testing -Xswiftc -warnings-as-errors -Xcc -Werror --sanitize address --disable-xctest
      - name: Run Tests
        run: |
          swift test --skip-build --configuration debug --disable-xctest
